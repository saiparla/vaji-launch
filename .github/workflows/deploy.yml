name: Deploy Vaji Launch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository including Git LFS media
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify dependency lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Commit the npm lockfile so npm ci can install reproducibly."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Inspect and prepare build output
        id: output
        shell: bash
        run: |
          echo "Build output directory listing:"
          find dist -maxdepth 3 -type f | head -200 || true

          if [ -d dist/client ]; then
            SITE_DIR="dist/client"
          elif [ -d dist ]; then
            SITE_DIR="dist"
          else
            echo "::error::Vite build did not create dist or dist/client."
            exit 1
          fi

          if [ ! -f "$SITE_DIR/index.html" ]; then
            echo "::error::No index.html found at the root of $SITE_DIR."
            exit 1
          fi

          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          touch "$SITE_DIR/.nojekyll"

          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"
          echo "Selected output: $SITE_DIR"
          du -sh "$SITE_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ steps.output.outputs.site_dir }}
          retention-days: 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
