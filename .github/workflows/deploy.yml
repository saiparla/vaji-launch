name: Deploy Vaji Launch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository including Git LFS media
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify dependency lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Commit the npm lockfile so npm ci can install reproducibly."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Inspect and prepare build output
        id: output
        shell: bash
        run: |
          echo "Build output directory listing:"
          find dist -maxdepth 3 -type f | head -200 || true

          if [ -d dist/client ]; then
            SITE_DIR="dist/client"
          elif [ -d dist ]; then
            SITE_DIR="dist"
          else
            echo "::error::Vike build did not create dist or dist/client."
            exit 1
          fi

          echo "HTML files generated by Vike:"
          find "$SITE_DIR" -type f -name '*.html' -print

          # Vike can prerender the root page to a nested index/index.html.
          # GitHub Pages needs the homepage at the artifact root.
          if [ -f "$SITE_DIR/index.html" ]; then
            HOME_HTML="$SITE_DIR/index.html"
          elif [ -f "$SITE_DIR/index/index.html" ]; then
            HOME_HTML="$SITE_DIR/index/index.html"
          else
            HOME_HTML="$(find "$SITE_DIR" -type f -name 'index.html' -print -quit)"
          fi

          if [ -z "$HOME_HTML" ] || [ ! -f "$HOME_HTML" ]; then
            echo "::error::No prerendered index.html was generated anywhere under $SITE_DIR."
            echo "Full build output:"
            find dist -maxdepth 5 -type f -print | sort
            exit 1
          fi

          if [ "$HOME_HTML" != "$SITE_DIR/index.html" ]; then
            cp "$HOME_HTML" "$SITE_DIR/index.html"
          fi

          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"

          # GitHub Pages serves nested index.html files reliably for clean route URLs.
          # Vike noExtraDir emits stage.html and overview.html, so mirror them into folders.
          for route in stage overview; do
            if [ -f "$SITE_DIR/$route.html" ]; then
              mkdir -p "$SITE_DIR/$route"
              cp "$SITE_DIR/$route.html" "$SITE_DIR/$route/index.html"
            elif [ ! -f "$SITE_DIR/$route/index.html" ]; then
              echo "::error::Vike did not generate $route.html or $route/index.html."
              exit 1
            fi
          done

          touch "$SITE_DIR/.nojekyll"

          echo "Selected output directory: $SITE_DIR"
          echo "Homepage source: $HOME_HTML"
          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"
          du -sh "$SITE_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ steps.output.outputs.site_dir }}
          retention-days: 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
